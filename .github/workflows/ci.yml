name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.lua }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.4', '5.1', 'luajit-2.1']
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install busted
        run: luarocks install busted
      - name: Test
        run: busted -o TAP test.lua

  lint:
    name: luacheck and rockspec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install luacheck
        run: luarocks install luacheck
      - name: luacheck
        run: luacheck mfr.lua test.lua
      - name: Lint the rockspec
        run: luarocks lint mfr-*.rockspec
