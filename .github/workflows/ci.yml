# ci.yml - test and lint mfr.lua on every push and pull request.
#
# Copyright (C) 2026 mb6ockatf
# This file is free software; see COPYING for copying conditions.
#
# Lua 5.1 and LuaJIT are allowed to fail for now: on them
# string.gmatch("%S*") also yields empty matches, so the space_split
# test fails there (Lua 5.4 changed that behaviour).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.lua }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lua: '5.4'
            experimental: false
          - lua: '5.1'
            experimental: true
          - lua: 'luajit-2.1'
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install busted
        run: luarocks install busted
      - name: Test
        run: busted -o TAP test.lua

  lint:
    name: luacheck and rockspec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install luacheck
        run: luarocks install luacheck
      - name: luacheck
        run: luacheck mfr.lua test.lua
      - name: Lint the rockspec
        run: luarocks lint mfr-*.rockspec
